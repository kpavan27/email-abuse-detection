data:
  url: https://raw.githubusercontent.com/MWiechmann/enron_spam_data/master/enron_spam_data.zip
  sha256: e994ad3c09fd7528b397e1f921742da5dd59f19695bc25cdb3617eb3ded17634
  raw_dir: data/raw
  processed_path: data/processed/messages.parquet
  max_chars: 5000

split:
  test_fraction: 0.2
  val_fraction: 0.2        # carved from train
  seed: 42

# mailbox-identity terms from the top ham features of an unmasked model
identity_tokens:
  - enron
  - ect
  - hou
  - ena
  - hpl
  - houston
  - vince
  - kaminski
  - louise
  - kitchen
  - daren
  - farmer
  - sally
  - beck
  - lavorato
  - shirley
  - crenshaw

operating_point:
  max_fpr: 0.005

models:
  c_grid: [2.0, 8.0, 32.0, 128.0]

evaluation:
  bootstrap_resamples: 1000
  seed: 7

paths:
  artifacts: artifacts
  reports: reports
