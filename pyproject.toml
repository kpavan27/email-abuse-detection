[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abuse-detect"
version = "1.0.0"
description = "Email spam/abuse detection with leakage controls, cost-aware thresholds, drift checks and error analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pavan Kolasani" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "duckdb>=0.10",
  "pyarrow>=14",
  "matplotlib>=3.7",
  "pyyaml>=6",
  "joblib>=1.3",
  "fastapi>=0.110",
  "pydantic>=2",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
abuse-detect = "abuse_detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abuse_detect = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
